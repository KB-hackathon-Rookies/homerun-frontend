name: '하위 이슈'
description: '상위 기능을 구성하는 세부 구현 작업입니다.'
title: '[하위 이슈] '

body:
    - type: input
      id: parent
      attributes:
          label: 🔗 상위 이슈
          description: 관련 상위 이슈 번호를 작성해 주세요.
          placeholder: '#12'
      validations:
          required: true

    - type: textarea
      id: work
      attributes:
          label: 🛠️ 작업 내용
          description: 이번 이슈에서 구현할 내용을 작성해 주세요.
          placeholder: |
              예) 정책별 신청 준비도를 확인할 수 있는 카드 UI를 구현한다.
      validations:
          required: true

    - type: textarea
      id: details
      attributes:
          label: 📌 세부 작업
          description: 구현할 세부 내용을 작성해 주세요.
          placeholder: |
              - [ ] 정책명 및 신청 기간 표시
              - [ ] 준비도 Progress UI 구현
              - [ ] 부족 서류 표시
              - [ ] 준비 완료 상태 처리
      validations:
          required: true

    - type: textarea
      id: references
      attributes:
          label: 🖼️ 참고 자료
          description: Figma, 스크린샷, API 명세 등 필요한 자료를 첨부해 주세요.
          placeholder: |
              Figma 링크 / 스크린샷 / API 명세 / 참고 자료
      validations:
          required: false

    - type: textarea
      id: acceptance
      attributes:
          label: ✅ 완료 조건
          description: 이 이슈를 완료할 수 있는 기준을 작성해 주세요.
          placeholder: |
              - [ ] 요구사항에 맞게 구현되었다.
              - [ ] 예외 상황이 처리되었다.
              - [ ] lint 및 typecheck를 통과한다.
      validations:
          required: true
