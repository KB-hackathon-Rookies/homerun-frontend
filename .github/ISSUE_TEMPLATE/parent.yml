name: '상위 이슈'
description: '여러 하위 작업을 포함하는 기능 단위 이슈입니다.'
title: '[상위 이슈] '

body:
    - type: textarea
      id: summary
      attributes:
          label: 🎯 작업 개요
          description: 구현할 기능과 목적을 작성해 주세요.
          placeholder: |
              예) 사용자의 재무 상황을 바탕으로
              독립 가능성을 분석하는 1루 진단 기능을 구현한다.
      validations:
          required: true

    - type: textarea
      id: scope
      attributes:
          label: 📌 작업 범위
          description: 이 기능에서 다룰 주요 범위를 작성해 주세요.
          placeholder: |
              - 재무 정보 입력
              - 입력값 검증
              - 진단 API 연동
              - 진단 결과 표시
      validations:
          required: true

    - type: textarea
      id: acceptance
      attributes:
          label: ✅ 완료 조건
          description: 상위 기능이 완료되었다고 판단할 기준을 작성해 주세요.
          placeholder: |
              - 주요 사용자 플로우가 정상 동작한다.
              - 관련 하위 이슈가 모두 완료되었다.
              - 요구사항을 충족한다.
      validations:
          required: true

    - type: textarea
      id: references
      attributes:
          label: 📎 참고 자료
          description: 필요한 경우 기획서, Figma, API 명세 등을 첨부해 주세요.
      validations:
          required: false
