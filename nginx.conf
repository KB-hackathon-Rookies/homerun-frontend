# SPA 정적 서빙.
#
# 라우팅을 브라우저가 하므로 서버에는 `/settle/1/checkin` 같은 파일이 없다.
# 없는 경로는 전부 앱 셸로 넘겨서 Vue Router 가 받게 한다.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # 해시가 붙은 자산은 내용이 바뀌면 이름도 바뀐다. 오래 캐시해도 안전하다.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 셸과 서비스워커는 캐시하지 않는다. 새로 배포한 것을 바로 받아야 한다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
