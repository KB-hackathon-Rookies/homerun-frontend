# SPA 정적 서빙.
#
# 라우팅을 브라우저가 하므로 서버에는 `/settle/1/checkin` 같은 파일이 없다.
# 없는 경로는 전부 앱 셸로 넘겨서 Vue Router 가 받게 한다.
# nginx 기본 목록에 웹 매니페스트가 없는 버전이 있다. 확장자를 직접 묶어 둔다.
# 타입이 틀리면 브라우저가 매니페스트를 무시하고 설치가 안 된다.
types {
    application/manifest+json  webmanifest;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # 빌드가 미리 만들어 둔 .gz 를 그대로 내보낸다(nuxt.config 의 compressPublicAssets).
    # 지금까지 아무것도 압축하지 않고 보내고 있었다 — 폰트 정의 CSS 하나가 무압축 55KB 였다.
    # gzip_static 은 미리 만든 파일을 쓰므로 요청마다 CPU 를 쓰지 않는다.
    gzip_static on;
    # 미리 만든 파일이 없는 응답(셸 등)만 그 자리에서 압축한다.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 해시가 붙은 자산은 내용이 바뀌면 이름도 바뀐다. 오래 캐시해도 안전하다.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 셸과 서비스워커는 캐시하지 않는다. 새로 배포한 것을 바로 받아야 한다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
